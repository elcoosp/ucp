[package]
name = "ucp-synthesizer"
version.workspace = true
edition.workspace = true
license.workspace = true


[features]
default = ["github-discovery", "license-check", "llm"]
github-discovery = ["octocrab"]
license-check = ["spdx"]
llm = ["reqwest"]

[dependencies]
ucp-core = { path = "../ucp-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
schemars = "1.2.3"
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["full"] }
spdx = { version = "0.13.6", optional = true }
octocrab = { version = "0.54.9", optional = true }
rayon = "1.11.0"
proc-macro2 = { version = "1.0.101", features = ["span-locations"] }
regex = "1.13.1"
async-trait = "0.1.92"
syn = { version = "3.0.9", features = ["full", "visit", "extra-traits"] }
quote = "1.0.47"
askama = "0.16.1"
serde_norway = "0.9.42"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
mockito = "1.7.2"
tokio-test = "0.4.6"
tempfile = "3.27.0"
insta = { version = "1.49.0", features = ["json", "yaml"] }
proptest = "1.12.0"

[[bench]]
name = "extraction_bench"
harness = false

[[bench]]
name = "merge_bench"
harness = false

[lints]
workspace = true

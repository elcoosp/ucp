# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Conventional Commits -> Keep a Changelog format, grouped by type.

[changelog]
title = "<!-- markdownlint-disable MD041 -->\n\n# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n"
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
    ### {{ group | upper_first }}\n\
    {% for commit in commits %}\
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first | trim }}\n\
    {% endfor %}\n
{% endfor %}\n
"""

[git]
# Parse commits according to Conventional Commits.
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🔨 Refactoring" },
    { message = "^doc", group = "📚 Documentation" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps", group = "📦 Dependencies" },
    { message = "^chore\\(ci\\)", group = "🤖 CI/CD" },
    { message = "^ci", group = "🤖 CI/CD" },
    { message = "^build", group = "🔨 Refactoring" },
    { message = "^style", group = "💄 Styling" },
    { message = "^revert", group = "↩️ Reverts" },
    { message = ".*", group = "🔧 Miscellaneous" },
]

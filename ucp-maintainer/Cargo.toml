[package]
name = "ucp-maintainer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ucp-core = { path = "../ucp-core" }
ucp-synthesizer = { path = "../ucp-synthesizer" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
ratatui = "0.30.2"
crossterm = "0.29.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
similar = "3.2.1"
notify = "8.2.0"
walkdir = "2.5.0"
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
tempfile = "3.27.0"

[lints]
workspace = true

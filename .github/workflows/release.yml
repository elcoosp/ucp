name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip crates.io publish)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ucp-cli-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ucp-cli-aarch64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ucp-cli-x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release
        run: cargo build --release --workspace --all-features
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/ucp dist/${{ matrix.archive }}
          tar -czf dist/${{ matrix.archive }}.tar.gz -C dist ${{ matrix.archive }}
          rm dist/${{ matrix.archive }}
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ucp.exe dist/${{ matrix.archive }}.exe
          Compress-Archive -Path dist/${{ matrix.archive }}.exe -DestinationPath dist/${{ matrix.archive }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/*

  changelog:
    name: Generate changelog with git-cliff
    runs-on: ubuntu-latest
    needs: [build]
    # Non-fatal: if the GitHub API metadata fetch fails, the release job
    # falls back to GitHub's auto-generated release notes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog for the latest tag
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: ${{ steps.cliff.outputs.changelog }}

  release:
    name: GitHub release + crates.io publish
    needs: [build, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # git-cliff output when available; GitHub notes otherwise.
          body_path: ${{ hashFiles('dist/changelog*') != '' && 'dist/changelog*' || '' }}
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
      - uses: actions/checkout@v4
      - name: Publish to crates.io
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        run: |
          for crate in ucp-core ucp-synthesizer ucp-maintainer ucp-cli; do
            cargo publish -p "$crate" --token "${CARGO_REGISTRY_TOKEN}" || \
              echo "::warning::publish of $crate failed (may already exist)"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
